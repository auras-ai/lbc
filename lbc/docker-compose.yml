services:
  lbc-api:
    build: .
    ports:
      - "${LBC_PORT:-8000}:8000"
    environment:
      - LBC_HEADLESS=true
    volumes:
      - lbc-profile:/data/lbc-profile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  lbc-profile:
