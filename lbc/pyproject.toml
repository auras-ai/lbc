[project]
name = "lbc"
version = "0.2.0"
description = "Leboncoin CLI — browser-emulated scraper + messaging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49.0",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "httpx>=0.28.1",
    "platformdirs>=4.3.6",
]

[project.scripts]
lbc = "lbc.cli:app"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
