services:
  # Telegram bot — the main service
  bot:
    build: .
    env_file: .env
    environment:
      - XDG_DATA_HOME=/data
    volumes:
      - lbc-profile:/data/lbc/chromium-profile
      # Mount cybex results so /cybex command works
      - ./cybex_results.yml:/app/cybex_results.yml:ro
    restart: unless-stopped

  # Optional: REST API (uncomment to enable)
  # api:
